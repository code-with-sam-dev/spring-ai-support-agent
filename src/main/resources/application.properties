spring.application.name=support-agent
server.port=${PORT:8420}

# The MCP server. Left unset, the WebMVC server serves the older SSE transport;
# Claude Code connects to streamable HTTP at /mcp, so it is set, not assumed.
spring.ai.mcp.server.name=payments-support
spring.ai.mcp.server.protocol=STREAMABLE

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5460}/support
spring.datasource.username=support
spring.datasource.password=support

# Policy passages in pgvector, embedded locally (all-MiniLM-L6-v2, 384 dimensions).
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=384

# Demo only: scripts/verify.sh generates a fresh secret for every run.
support.jwt.secret=${SUPPORT_JWT_SECRET}

# The embedding model is downloaded once and kept, not fetched on every start.
spring.ai.embedding.transformer.cache.directory=\
    ${SPRING_AI_MODEL_CACHE:${user.home}/.cache/spring-ai-models}
